[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wevibe-bench"
version = "0.1.0"
description = "OFF/ON coding-agent memory-ablation harness for WeVibe"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["wevibe_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "serial: marks tests that must not run in parallel (use --dist no with serial marker)",
]
addopts = "-n auto -m \"not slow\" --dist=load --timeout=60 --strict-markers --tb=short -ra"
timeout = 60
timeout_method = "thread"
log_cli = true
log_cli_level = "INFO"
