<!doctype html>
<html lang="en" data-theme="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeVibe Bench Board v2</title>
<!--
─────────────────────────────────────────────────────────────────────────────
 WEVIBE BENCH BOARD v2 — LONGITUDINAL FRAME

 ONE QUESTION THIS BOARD ANSWERS:
   does a growing memory corpus make the SAME local model finish the SAME
   build in fewer turns, fewer tokens and less time — and at what corpus size
   does that stop being true?

 TWO AXES, NEVER BLENDED (hard rule):
   CORRECTNESS  gates passed / total          → GATE WALL
   EFFICIENCY   turns · tokens · wall time    → TRANSFER CURVE
 They sit adjacent, at equal weight. They are never multiplied, averaged or
 collapsed into a score. An ON run CAN be faster AND worse — the last OFF cell
 was FAIL with 25 failed gates — and a layout that makes faster-and-worse read
 as a win is a broken layout.

 CELL = 3 PHASES:
   1 BUILD   harness label `initial`   — internally 6 work orders (phase 1 only)
   2 GRADE   verdict-pass-1 / feedback-1
   3 GRADE   verdict-pass-2 / feedback-2

 JSON CONTRACT v2.0 — what this board consumes. Diff against contract.mjs and
 against what the backend actually emits.

 {
   contract_version, generated_at,
   run:        { org_id, model, arm, cell_label, started_at, elapsed_s, phase,
                 chunk{current,total}, attempt{current,max}, turns,
                 session_turns, tokens{input,output,injected_block}, state,
                 session_id, log_silent_s, terminal_status }
   stack:      { id, baseline, runs[], metrics{turns,tokens,seconds},
                 state, corpus_source }
                 baseline = the ONE OFF cell. n=1 BY DESIGN, never a
                 distribution. runs[] = ON cells in sequence order.
   provenance: { attestation, gate_mode, gate_mode_source, policy_version,
                 policy_anchor_status, worker_image_fp, leader_fp, corpus, seed }
   wall:       { gates:[{id,req,title,a,b,...}], totals:{a,b} }
   hold:       null | { url, ui_healthy, boot_detail, server_log, started_at,
                        held_seconds, release{path,...}, bind{...}, ... }
   profile:    { exists, models[], created_at, enforced:false, stack_id }
   honesty:    { … the rail … }
   sources:    [{ id, ok, fields[], reason, provenance, ms }]
 }

 EVERY FIELD IS NULLABLE. null = NOT OBSERVED and renders as an explicit state.
 Three null-ish states stay visually distinct: unobserved / unwired / zero.
 A MEASURED ZERO IS NOT MISSING DATA and never renders like one.
─────────────────────────────────────────────────────────────────────────────
-->
<style>
/* ══════════════════════════════════════════════════════════════════════════
   WeVibe Design System — GREEN phosphor.
   Values below are lifted VERBATIM from the design source's own token file
   (`WeVibe Bench Board v2.html`, unpacked). They are not approximations and
   must not be "tidied" — the board is judged against that artifact.
   ══════════════════════════════════════════════════════════════════════════ */

:root,
[data-theme="green"] {
  /* surfaces */
  --bg:        #02100a;   /* canvas — deepest screen black-green */
  --bg-2:      #04190f;   /* raised surface / panel */

  /* text */
  --fg:        #2fe07a;   /* default foreground — phosphor text */
  --dim:       #0f5e32;   /* de-emphasis: notes, axis, hints */
  --comment:   #1d7a44;
  --type:      #e2ffec;   /* brightest — titles & headline numbers */
  --cmd:       #e2ffec;

  /* signal */
  --accent:    #54f59a;
  --ok:        #b8ffcf;
  --check:     #6dff9e;
  --link:      #aaffc8;
  --link-glow: #27ff7eaa;
  --cursor:    #6dff9e;
  /* THE ONLY OFF-HUE. Reserved for: gate failure, regression, the
     DECLARED-NOT-ENFORCED debt, and a LAN-exposed hold. Never decorative. */
  --danger:    #ff6b6b;

  /* semantic aliases — product code uses THESE */
  --surface:        var(--bg);
  --surface-raised: var(--bg-2);
  --text-bright:    var(--type);
  --text-body:      var(--fg);
  --text-muted:     var(--dim);
  --border:         color-mix(in srgb, var(--fg) 14%, transparent);
  --border-strong:  color-mix(in srgb, var(--fg) 22%, transparent);
  --hairline:       color-mix(in srgb, var(--fg) 10%, transparent);
  --selection:      color-mix(in srgb, var(--accent) 38%, transparent);
  --focus-ring:     color-mix(in srgb, var(--accent) 18%, transparent);
  --glow:           color-mix(in srgb, var(--accent) 12%, transparent);

  /* typography — one typeface, hierarchy from weight/size/colour/tracking */
  --font: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* spacing / radii / elevation */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:24px; --space-6:32px; --space-7:44px;
  --radius-sm:6px; --radius-md:8px; --radius-lg:10px; --radius-xl:12px;
  --radius-pill:999px;
  --shadow-raise: 0 10px 30px rgba(0,0,0,.4);
  --shadow-term:  0 30px 80px rgba(0,0,0,.5);

  --ease: cubic-bezier(.2,.6,.2,1);
  --dur-fast:.12s; --dur-base:.15s;

  /* ── MOTION — lifted VERBATIM from the design system's tokens/motion.css ──
     "Nothing fades in. Everything is TYPED, as if a developer is at the
      keyboard right now. Cadence is human, not metronomic."

     These sixteen tokens were declared by the design system and NONE of them
     existed in this board — the README recorded the deviation as "No ambient
     animation", which was true and was the gap. They live here, in CSS, as the
     single source of truth: ui.js READS them via getComputedStyle rather than
     duplicating the numbers in JS, because two copies of a value drift and the
     board has already been bitten once by exactly that.

     They are not decoration. The typed cadence is the brand's signature and
     the reason motion here reads as a person at a keyboard rather than a
     progress bar. */

  /* typing cadence (per character) */
  --type-char-min: 7ms;
  --type-char-max: 18ms;
  --type-space-mult: 1.2;    /* spaces are slightly slower */
  --type-punct-mult: 1.3;    /* punctuation lingers */
  --type-think-chance: 0.02; /* 2% chance of a 40–110ms pause */

  /* global tempo knob */
  --tempo-chill: 1.7;
  --tempo-normal: 1.0;
  --tempo-fast: 0.5;

  /* the cursor — hard steps, no fade */
  --cursor-blink: 1.05s;

  /* grid trail */
  --trail-hold: 200ms;
  --trail-fade: 400ms;
  --trail-life: 600ms;       /* hold + fade */

  /* loading sweep */
  --sweep-step: 105ms;
  --sweep-cycles: 3;

  /* board geometry — measured off the design source.
     §8.1 of the artifact is a 1920px board with curve|wall at 50/50. */
  --pad: 14px;
  --gap: 14px;
  --board-max: 1920px;

  /* ── TYPE SCALE ──────────────────────────────────────────────────────────
     recall.js consumes --fs-label / --fs-ident and rail.js consumes
     --fs-metric. They were dropped in the token rewrite, so every rule
     keyed on them silently resolved to nothing and the text rendered at
     inherited size. Restored at the artifact's own measured values. */
  --fs-label:  11px;   /* kickers, axis labels, rail captions */
  --fs-ident:  12px;   /* identifiers, cids, verbatim strings */
  --fs-body:   12.5px; /* body copy inside panels */
  --fs-row:    13px;   /* ledger + feed rows */
  --fs-metric: 22px;   /* headline numbers (rail derives .8 of this) */

  /* ── SEMANTIC SIGNAL ALIASES ─────────────────────────────────────────────
     The panels were written against these names and they outlived the
     rewrite that removed them. --fail/--pass/--arm-a/--arm-b/--rule/--null
     are what recall.js, live.js and the wall actually reference. They are
     ALIASES onto the one palette above, never a second palette: --fail is
     --danger, the only off-hue on the board. */
  --fail:  var(--danger);
  --pass:  var(--fg);
  --arm-a: var(--fg);      /* MEMORY ON */
  --arm-b: var(--dim);     /* CONTROL   */
  --rule:  var(--hairline);
  --null:  var(--dim);
  --panel: var(--bg-2);
}

/* ── WEBFONT ────────────────────────────────────────────────────────────────
   JetBrains Mono is the brand's ONE typeface and it is NOT installed on the
   operator's host (verified: 0 matches in ~/Library/Fonts and the system font
   list), so every `font-family:'JetBrains Mono'` rule was silently falling
   back to SF Mono. The artifact bundles the woff2 binaries; the board is
   containerised and must not reach the network to render, so the faces are
   declared against Google's CDN with a local() first — if the operator ever
   installs it, no fetch happens at all.

   font-display:swap is deliberate: the board is a long-lived operations
   surface, and blocking first paint on a font is worse than one reflow. */
@font-face{
  font-family:'JetBrains Mono'; font-style:normal; font-weight:400 800;
  font-display:swap;
  src:local('JetBrains Mono'), local('JetBrainsMono-Regular'),
      url('https://fonts.gstatic.com/s/jetbrainsmono/v24/tDbY2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKxTOlOVigKp2Q.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:'JetBrains Mono'; font-style:italic; font-weight:400 800;
  font-display:swap;
  src:local('JetBrains Mono Italic'), local('JetBrainsMono-Italic'),
      url('https://fonts.gstatic.com/s/jetbrainsmono/v24/tDbX2o-flEEny0FZhsfKu5WU4xD-IQ-PuZJJXxfpAO-Lf1OQk6OThxPA.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}

/* ── VIEWPORT STEP-DOWN ──────────────────────────────────────────────────
   1920+ is the primary target. The board must ALSO survive 1440×900,
   1366×768 and 1280×800 — measured breakpoints, not guesses. The ledger's
   fixed track list is the thing that overflows first, so the narrow steps
   shrink the identity columns (model, corpus) rather than the numbers, and
   the rail reflows from 6 fixed columns to auto-fit. Nothing is hidden. */
:root { --ledger-cols: 52px 62px 210px 128px 78px 96px 84px 96px 104px 104px 1fr; }
@media (max-width:1600px){
  :root { --ledger-cols: 46px 56px 150px 116px 70px 84px 78px 90px 88px 96px 1fr; --pad:12px; --gap:12px; }
}
@media (max-width:1400px){
  :root { --ledger-cols: 42px 50px 118px 104px 62px 76px 72px 84px 78px 88px 1fr; }
}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--font); font-size:13px;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
::selection{background:var(--selection);color:var(--type)}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--type)}

/* The board is a VERTICAL DOCUMENT, not a fixed viewport grid.
   v1 pinned everything to 100vh with overflow:hidden, which silently
   AMPUTATED panel tails on a laptop — content clipped without a mark is
   indistinguishable from content that was never rendered, the exact
   dishonesty the null-state rules exist to stop. Eight surfaces do not fit
   in 800px of height honestly, so the page scrolls and the chrome sticks. */
#root{
  display:flex; flex-direction:column; gap:var(--gap);
  padding:var(--pad);
  padding-bottom:64px;
  min-height:100vh;
  width:min(100vw, var(--board-max));
}
.shell{max-width:var(--board-max);margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);width:100%;min-width:0}

/* NO AMBIENT ANIMATION. The board is on screen for hours. Motion is reserved
   for STATE CHANGES that announce themselves once and settle — never a loop
   that runs while nothing is happening. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important}
}

/* ── SHARED KEYFRAMES from the design system (tokens/motion.css) ───────────
   Available to every component. `wv-blink` is HARD STEPS, not a fade — the
   cursor is a block that is either there or not, which is what makes it read
   as a terminal rather than a pulsing dot. */
@keyframes wv-blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
@keyframes wv-trail{0%,33%{opacity:1}100%{opacity:0}}

/* THE BLOCK CURSOR. The brand's signature mark, shown where the board is
   waiting on something that is actively producing output. */
.wv-cursor{
  display:inline-block;width:.6em;height:1.05em;vertical-align:text-bottom;
  background:var(--cursor);animation:wv-blink var(--cursor-blink) steps(1) infinite;
}
@media (prefers-reduced-motion:reduce){.wv-cursor{animation:none;opacity:1}}

/* ── shared atoms ───────────────────────────────────────────────────────── */

.ttl{font:700 11px var(--font);letter-spacing:.18em;color:var(--type)}
.sub{font:400 12px var(--font);color:var(--dim)}
.kick{font:700 10.5px var(--font);letter-spacing:.16em;color:var(--dim)}
.note{font:400 12px/1.6 var(--font);color:var(--dim)}
.bright{color:var(--type)}
.danger{color:var(--danger)}
.muted{color:var(--dim)}

/* THE null renderer. Three kinds of nothing stay visually distinct:
   unobserved (not measured yet) · unwired (source absent) · zero (measured). */
.null{color:var(--dim);font-style:normal}

.panel{
  background:var(--bg-2); border:1px solid var(--border);
  border-radius:var(--radius-xl); padding:var(--pad);
  display:flex; flex-direction:column; gap:12px; min-width:0;
}
.phead{display:flex;align-items:baseline;gap:12px;min-width:0}
.phead .sub{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tag{
  font:700 11px var(--font);letter-spacing:.14em;
  color:var(--dim);border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);padding:4px 8px;white-space:nowrap;
}
.tag.on{color:var(--type)}
.tag.bad{color:var(--danger);border-color:var(--danger)}

/* THE DEBT BADGE. Double rule + the words, so it survives a greyscale
   screenshot. It is not decoration — it is the visible debt, and it
   disappears the day the recall filter ships. */
.debt{
  font:700 11.5px var(--font);letter-spacing:.14em;color:var(--danger);
  border-top:2px solid var(--danger);border-bottom:2px solid var(--danger);
  padding:2px 0;white-space:nowrap;
}

/* segmented control — the curve's metric + scope switches */
.seg{display:flex;border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden;flex:none}
.seg button{
  font:400 11px var(--font);letter-spacing:.12em;
  padding:5px 11px;background:transparent;color:var(--fg);
  border:0;border-left:1px solid var(--border-strong);cursor:pointer;
}
.seg button:first-child{border-left:0}
.seg button.on{font-weight:700;background:var(--fg);color:var(--bg)}
.seg button:hover:not(.on){color:var(--type)}

.btn{
  font:700 12px var(--font);letter-spacing:.12em;
  background:transparent;color:var(--fg);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  padding:8px 14px;cursor:pointer;
}
.btn:hover:not(:disabled){color:var(--type);border-color:var(--fg)}
.btn:disabled{color:var(--dim);border-color:var(--hairline);cursor:not-allowed}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover:not(:disabled){background:var(--check);border-color:var(--check);color:var(--bg)}
.btn.destroy{color:var(--danger);border-color:var(--danger)}
.btn.destroy:hover:not(:disabled){background:var(--danger);color:var(--bg)}
.btn.sm{font-size:11px;padding:3px 8px}

.sel,.inp{
  font:400 12px var(--font);
  background:var(--bg);color:var(--type);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  padding:6px 8px;width:100%;
}
.sel:disabled,.inp:disabled{color:var(--dim);opacity:.6;cursor:not-allowed}

/* ── topbar ─────────────────────────────────────────────────────────────── */
/* NOWRAP IS LOAD-BEARING: these are single-line identity chips. Wrapping them
   grows the bar and cascades height into every row below. The long, repeated
   identifiers (model, campaign) are the only things allowed to ellipsize. */
.topbar{
  display:flex;align-items:center;gap:16px;
  padding:0 4px 12px;border-bottom:1px solid var(--hairline);
  flex-wrap:nowrap;white-space:nowrap;
  position:sticky;top:0;z-index:30;background:var(--bg);
  padding-top:2px;
}
.topbar>*{flex:0 0 auto}
.brand{font:800 15px/1 var(--font);color:var(--type);letter-spacing:.02em}
.brand u{text-decoration-color:var(--fg);text-underline-offset:3px}
.vr{width:1px;height:18px;background:var(--border-strong)}
.chip{font:400 13px var(--font);color:var(--fg)}
.chip.dimchip{color:var(--dim)}
.chip.shrink{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1 1 auto;min-width:0}

/* ── provenance strip ───────────────────────────────────────────────────── */
.prov{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding-top:10px;border-top:1px solid var(--hairline);
  font:400 11.5px var(--font);color:var(--dim);
}
</style>
<style id="panelcss">
/* panel CSS is appended below — see the second style block */
.axes-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap);align-items:stretch}
/* THE PANEL. 12px radius + --border (not --hairline) is the artifact's own
   §8.1 measurement; the rewrite had flattened every panel to a 4px box with
   box-shadow:none, which read as a wireframe rather than a raised surface. */
.curve,.wall,.ledger,.live,.hold,.rail{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-xl);padding:var(--pad);display:flex;flex-direction:column;gap:12px;min-width:0}
.curve-frame,.curve-foot,.hold-line,.hold-diag,.tui-head,.tui-foot,.ledger-head,.ledger-cols,.ledger-row,.axis,.big,.prov,.live-spine,.feed-head,.stages{font-family:var(--font)}
.curve-frame{padding:22px;border:1px solid var(--border);border-radius:var(--radius-md);background:linear-gradient(180deg,color-mix(in srgb,var(--bg-2) 85%, transparent),var(--bg-2))}
.curve-svg{overflow:visible}
.c-axis,.c-legend,.c-note,.c-base-lbl,.c-annot,.c-val,.c-delta,.c-gate,.c-corpus{fill:var(--dim);font-size:11px}
.c-base,.c-path,.c-ax{stroke:var(--fg);stroke-width:1.5;fill:none;stroke-dasharray:8 6}
.c-pt{fill:var(--fg);stroke:var(--fg);stroke-width:2}
.c-pt.worse{fill:var(--bg-2);stroke:var(--danger)}
.c-delta.bad,.c-gate.bad{fill:var(--danger)}
.ledger-head,.ledger-cols,.ledger-row,.axes,.axis,.prov,.feed-head,.tui-bar,.tui-head,.tui-foot,.confirm-actions{display:flex;align-items:center;gap:12px;min-width:0}
.ledger-cols,.ledger-row{display:grid;grid-template-columns:var(--ledger-cols);gap:12px;align-items:center}
.ledger-cols{font:700 10px var(--font);letter-spacing:.16em;color:var(--dim);padding-bottom:8px;border-bottom:1px solid var(--hairline)}
.ledger-row{padding:10px 0;border-bottom:1px solid color-mix(in srgb, var(--fg) 8%, transparent)}
.ledger-row.live{color:var(--type)}
.ledger-row.void{color:var(--dim)}
.ledger-foot{display:flex;align-items:stretch;justify-content:space-between;gap:var(--gap);padding-top:12px;border-top:1px solid var(--hairline)}
.pin,.axis{flex:1 1 0;min-width:0}
.big{display:flex;flex-direction:column;gap:4px;font:700 13px var(--font)}
.hold{gap:10px}
.hold.lan,.hold.dead{border-color:var(--danger)}
.hold-url,.hold-actions,.hold-diag{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.muted-box{padding:8px 10px;border:1px solid var(--danger);border-radius:var(--radius-sm)}

.mrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer}
.mrow.on{border-color:var(--fg);background:color-mix(in srgb, var(--fg) 8%, transparent)}
/* The subject row carries a fourth cell (the SUBJECT tag). The model id keeps
   the larger share: it is the identifier being read, and the note beside it
   ("memory count unobserved") is the part that can afford to truncate. */
.mrow.subj{grid-template-columns:24px minmax(0,1.4fr) auto minmax(0,1fr)}
.mrow .mid{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.subjtag{font:700 9.5px var(--font);letter-spacing:.16em;color:var(--bg);background:var(--accent);border-radius:var(--radius-pill);padding:2px 8px;white-space:nowrap}

/* ── PROFILE: THE TWO FROZEN AXES ────────────────────────────────────────
   Subject and memory roster are drawn as two separate blocks, never one list.
   They answer different questions (what is measured / what is varied) and the
   single flat list they replaced is exactly what made transfer direction
   unrecordable.

   THE SUBJECT'S IDENTITY TYPE. Everything else that described a frozen profile
   (.profile-card, .profile-subject, .profile-models, .skick, and the whole
   .insp-* inspector) is gone with those two surfaces — the frozen policy is now
   a drawer in the RUN LEDGER, styled under THE MODEL LEDGER below. */
.sval{font:700 var(--fs-ident)/1.4 var(--font);color:var(--type)}

/* ── THE INFERRED TRANSFER EDGE ──────────────────────────────────────────
   Never a control. `self` is the only edge that can be stated completely, so
   it is the only one drawn settled; everything else carries the unranked mark
   so a cross-model edge can never read as though its direction were known. */
.xfer{display:flex;flex-direction:column;gap:5px;padding:10px 11px;border:1px solid var(--border);border-radius:var(--radius-sm)}
.xfer.self{border-color:var(--accent)}
.xfer.cross,.xfer.mixed{border-style:dashed;border-color:var(--border-strong)}
.xfer.unset{border-style:dashed;border-color:var(--hairline)}
.xfer-kind{font:700 10.5px var(--font);letter-spacing:.16em;color:var(--type)}
.xfer-dir{font:700 10px var(--font);letter-spacing:.14em}
.xfer-dir.settled{color:var(--accent)}
.xfer-dir.unranked{color:var(--dim)}

/* THE OLD CREATION MODAL'S SECTIONS ARE GONE (.pick-sec/.pick-rows/.ackrow/
   .ackbox). It asked both frozen facts on one tall form with an acknowledgement
   checkbox at the foot; that is now the three PROFILE frames of the [+ PROFILE]
   flow, whose rules are `.cframe`/`.c*` above. The rules are deleted rather than
   left in place because dead CSS is indistinguishable from live CSS to the next
   reader, and this stylesheet has already lost 78 definitions once to an edit
   made without knowing which were load-bearing. */

/* THE FREEZE REFUSAL. Rendered where the click happened, because a refusal the
   operator cannot see is a swallowed error no matter where it was logged. The
   server's own prose is shown verbatim — this surface never paraphrases it. */
.freeze-refusal{display:flex;flex-direction:column;gap:5px;padding:10px 12px;border:1px solid var(--danger);border-radius:var(--radius-md)}
.fr-head{font:700 10.5px var(--font);letter-spacing:.16em;color:var(--danger)}
.fr-code{font:700 12px var(--font);color:var(--fg)}
.fr-reason{font:400 var(--fs-body)/1.5 var(--font);color:var(--fg);white-space:pre-line}
.fr-note{font:400 11.5px/1.45 var(--font);color:var(--dim)}

/* CONTROL PLANE UNREACHABLE. Full-width, directly under the top bar, because
   it invalidates every write control on the board at once. Stated before the
   operator clicks rather than as a failure afterwards. */
.reach-warn{display:flex;flex-direction:column;gap:6px;padding:11px 14px;border:1px solid var(--danger);border-radius:var(--radius-lg);background:var(--surface-raised)}
.rw-head{font:700 10.5px var(--font);letter-spacing:.16em;color:var(--danger)}
.rw-body{font:400 var(--fs-body)/1.55 var(--font);color:var(--fg)}
.rw-fix{font:400 12px/1.5 var(--font);color:var(--fg);padding:7px 9px;border:1px solid var(--hairline);border-radius:var(--radius-sm);background:var(--bg);white-space:pre-wrap;word-break:break-word}
.rw-note{font:400 11.5px/1.45 var(--font);color:var(--dim)}
.modal-scrim{position:fixed;inset:0;background:rgba(2,16,10,.82);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
.modal{width:min(920px,calc(100vw - 48px));max-height:calc(100vh - 48px);overflow:auto;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:var(--radius-xl);padding:var(--pad);box-shadow:var(--shadow-term);display:flex;flex-direction:column;gap:12px}

/* ── THE [+ PROFILE] FLOW ──────────────────────────────────────────────────
   One chooser, then three steps on either branch. ONE FRAME ON SCREEN AT A
   TIME — the design sheet lays all eight side by side because it is a specimen
   of the sequence, not a specimen of the dialog.

   NARROWER THAN .modal, and fixed-height. At 920px a five-line question spans
   the screen and the two controls drift to opposite corners, which reads as a
   form rather than as a step. The min-height is what stops the footer jumping
   as frames of different lengths replace each other: a BACK button that moves
   between clicks gets misclicked, and on this flow a misclick costs the
   operator their place in a three-step sequence. */
.cmodal{width:min(620px,calc(100vw - 48px));padding:0}
.cframe{display:flex;flex-direction:column;gap:11px;padding:var(--pad);min-height:420px}
.chead{display:flex;align-items:baseline;gap:9px}
/* The step label is the operator's position in the sequence. It is the
   brightest thing in the header for that reason — "which of three am I on" is
   the question a multi-step dialog most often fails to answer. */
.cstep{font:700 10px var(--font);letter-spacing:.16em;color:var(--type)}
.cframe.final .cstep{color:var(--check)}
.cbranch{font:400 11px var(--font);color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cclose{font:400 11px var(--font);color:var(--dim);background:none;border:none;cursor:pointer;padding:2px 4px}
.cclose:hover{color:var(--fg)}
.ctitle{font:700 14px/1.35 var(--font);color:var(--type)}
.cbody{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.cnote{font:400 11.5px/1.5 var(--font);color:var(--dim)}
.cframe.final{border-top:2px solid var(--check)}

/* ONE SELECTABLE LINE, and the four states are distinguished by BORDER STYLE
   as well as colour, so the flow is usable in greyscale and by a viewer with
   colour vision deficiency — the same rule the arm vocabulary follows. */
.cline{display:flex;align-items:baseline;gap:9px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;min-width:0}
.cline.off{cursor:pointer}
.cline.off:hover{border-color:var(--border-strong);background:color-mix(in srgb, var(--fg) 4%, transparent)}
.cline.on{border-color:var(--check);background:var(--bg-2);cursor:pointer}
/* DEAD IS DIM AND UNHOVERABLE — it must not read as a control awaiting a click.
   Its `meta` line carries the refusal, which is why the line is kept at all
   rather than being hidden: the reason is the thing the operator needs. */
.cline.dead{border-color:var(--hairline);color:var(--dim);cursor:not-allowed}
.cline.ghost{border-style:dashed;border-color:var(--border)}
.cglyph{flex:none;font:400 11.5px var(--font);color:var(--dim);width:12px}
.cline.on .cglyph{color:var(--check)}
.cline.dead .cglyph{color:var(--hairline)}
.ctext{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.ct{font:400 12.5px/1.35 var(--font);color:var(--fg);overflow-wrap:anywhere}
.cline.dead .ct{color:var(--dim)}
.cm{font:400 10.5px/1.4 var(--font);color:var(--dim);overflow-wrap:anywhere}

/* THE MODEL LIST SCROLLS, THE FRAME DOES NOT. A dialog whose own height tracks
   its longest list makes the footer controls move between steps. */
.clist{display:flex;flex-direction:column;gap:5px;max-height:230px;overflow-y:auto;overscroll-behavior:contain;min-width:0}
.cfilters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.csearch,.cprov{font:400 12px var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:6px 9px}
.csearch{flex:1;min-width:140px}
.cshown{font:400 10.5px var(--font);color:var(--dim);white-space:nowrap}

/* THE KEY REPORT. Bordered like a statement, never like a field — there is no
   input here and the block exists partly to make that obvious. */
.ckey{display:flex;flex-direction:column;gap:3px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 10px;margin-top:4px}
.ckey.on{border-color:var(--check)}
.ckey.bad{border-color:var(--danger)}
.ckey-head{font:700 10px var(--font);letter-spacing:.14em;color:var(--fg)}
.ckey.bad .ckey-head{color:var(--danger)}
.ckey-body{font:400 11.5px/1.45 var(--font);color:var(--fg);overflow-wrap:anywhere}
.ckey-note{font:400 10.5px/1.45 var(--font);color:var(--dim)}

.cdebt{font:400 11.5px/1.55 var(--font);color:var(--fg)}

/* THE FOOTER. BACK left, CTA right, and the CTA is the only filled control on
   the frame — dismissing or retreating costs nothing, so neither may compete
   visually with the choice that spends hours or freezes a file forever. */
.cfoot{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--hairline)}
.cback{font:400 11px var(--font);color:var(--dim);background:none;border:none;cursor:pointer;padding:4px 2px}
.cback:hover{color:var(--fg)}
.cta{font:700 10.5px var(--font);letter-spacing:.12em;color:var(--bg);background:var(--fg);border:1px solid var(--fg);border-radius:var(--radius-sm);padding:7px 12px;cursor:pointer}
.cta.final{background:var(--check);border-color:var(--check);box-shadow:0 0 18px var(--glow)}
/* DISABLED IS UNFILLED AND DASHED — it must not read as a button awaiting a
   click, and the frame's own note says what it is waiting for. */
.cta:disabled{background:transparent;color:var(--dim);border:1px dashed var(--border-strong);box-shadow:none;cursor:not-allowed}

/* ── RUN CONTROL, RAISED ON ITS OWN ────────────────────────────────────────
   The run control used to render ONLY inside the profile inspector, so the
   CONFIRM button and every refusal were unreachable unless a profile existed —
   which is why [+ baseline] armed a run that could never be confirmed. It now
   has its own dialog, raised only while there is something to confirm or a
   refusal to read. Narrow, because it is one decision. */
.rmodal{width:min(640px,calc(100vw - 48px))}
.rmodal-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px;padding-top:10px;border-top:1px solid var(--hairline)}
/* A CLOUD CELL IS BILLED, AND THE CONTROL THAT STARTS IT SAYS SO. Ruled top and
   bottom like the debt badge so it survives greyscale — this is the one fact on
   the run control that costs money if it goes unread, and it is not the same
   class of thing as a refusal, so it is not drawn in the failure hue. */
.rcloud{padding:8px 0;border-top:2px solid var(--link);border-bottom:2px solid var(--link);font:700 11px/1.5 var(--font);letter-spacing:.04em;color:var(--link)}

/* ── THE PROFILE INSPECTOR IS GONE ─────────────────────────────────────────
   It was a 1360px modal that described ONE profile — `board.profile`, the
   single global field — while the ledger underneath it listed every profile on
   disk. Reading a frozen policy is not a dialog: it is a drawer under the row
   that names it, and its rules are `.pdrawer`/`.pd-*` in THE MODEL LEDGER
   below. The `.debt-kick`/`.debt-body` type it defined survives there, which is
   why those two rules moved rather than being deleted with the rest. */

/* ── EVENT-KIND FILTER CHIPS (panels/live.js) ──────────────────────────────
   These are <button>s, and `.chip` alone sets only font and colour — so they
   inherited the UA's white background with green text, and the on/off state
   that the whole control exists to express had NO definition at all: an
   operator could not tell an included kind from an excluded one.

   OFF IS DRAWN AS ABSENCE, NOT AS A DIFFERENT COLOUR. A muted, hollow chip
   reads as "these rows are not in the feed"; a second hue would read as a
   second category of event, which is exactly the confusion to avoid. */
.chip.on,.chip.off{
  font:700 11px var(--font);letter-spacing:.10em;
  background:transparent;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);padding:3px 9px;cursor:pointer;
}
.chip.on{color:var(--fg);border-color:var(--fg)}
.chip.on:hover{color:var(--type);border-color:var(--type)}
.chip.off{color:var(--dim);border-color:var(--hairline)}
.chip.off:hover{color:var(--fg);border-color:var(--border-strong)}
/* A NON-ZERO ERROR COUNT OUTRANKS THE FILTER STATE. Errors are the one kind an
   operator must not be able to overlook, so the count carries the danger hue
   even while the chip is toggled on. It stays a border+text treatment — never a
   filled block — so it cannot be mistaken for a pressed state. */
.chip.err{color:var(--danger);border-color:var(--danger)}
.chip.err:hover{color:var(--danger);border-color:var(--danger)}

/* ── RUN CONTROL ───────────────────────────────────────────────────────────
   Design 5b. Four states: idle · blocked (with the reason ON the control) ·
   live (confirm, naming what is abandoned) · starting (bounded counter). */
.runctl{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-top:1px solid var(--border-strong)}
.runctl-head{display:flex;align-items:baseline;gap:12px;min-width:0}
.runctl-form{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;align-items:center}
/* A pinned subject is a STATEMENT, not a disabled select. It is drawn as text
   with its reason attached, so it never reads as a control awaiting unlock. */
.rpin{display:flex;flex-direction:column;gap:2px;font:700 var(--fs-ident)/1.4 var(--font);color:var(--type);min-width:0}
.rpin-why{font:400 10.5px/1.4 var(--font);letter-spacing:.02em;color:var(--dim)}
.rrow label{font:700 10.5px var(--font);letter-spacing:.16em;color:var(--dim)}
.rsel{font:400 12px var(--font);background:var(--bg);color:var(--type);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:6px 8px;width:100%}
.rsel:disabled{color:var(--dim);opacity:.6;cursor:not-allowed}
/* The server's own words, verbatim. Pre-wrapped because the restatement is
   composed as lines and its line breaks carry meaning. */
.restate{white-space:pre-wrap;font:400 12px/1.6 var(--font);color:var(--type);padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg)}
.abandon{display:flex;flex-direction:column;gap:8px;padding:11px 13px;border:1px solid var(--danger);border-radius:var(--radius-md)}
.abandon .note{color:var(--fg)}
.rwhy{font:400 11.5px/1.5 var(--font);color:var(--dim)}
.rwhy.bad{color:var(--danger)}
.runbtn{font:700 11.5px var(--font);letter-spacing:.14em;padding:9px 16px;border-radius:var(--radius-sm);cursor:pointer;background:var(--check);color:var(--bg);border:1px solid var(--check);box-shadow:0 0 18px var(--glow);text-align:center}
.runbtn:hover:not(:disabled){background:var(--type);border-color:var(--type)}
.runbtn.armed{background:var(--danger);border-color:var(--danger);color:var(--bg);box-shadow:none}
/* BLOCKED IS DASHED AND UNFILLED — it must not read as a button awaiting a
   click. The reason rides the label itself, never a tooltip: nobody watching a
   stream can hover, and a control disabled without saying why is
   indistinguishable from one that is broken. */
.runbtn.blocked,.runbtn:disabled{background:transparent;color:var(--dim);border:1px dashed var(--border-strong);box-shadow:none;cursor:not-allowed}
.starting{display:flex;align-items:center;gap:11px;padding:9px 14px;border:1px solid var(--fg);border-radius:var(--radius-sm);flex-wrap:wrap}
.starting .ttl{color:var(--type)}
.dots{display:flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--fg);animation:dotsweep 315ms steps(1) infinite}
.dots i:nth-child(2){animation-delay:105ms}
.dots i:nth-child(3){animation-delay:210ms}
/* The elapsed counter is the honest signal; the dots are decoration. Under
   reduced motion the dots hold still and the counter still proves liveness. */
@keyframes dotsweep{0%,32%{opacity:1}33%,100%{opacity:.18}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:1}}

.tui-dock{position:fixed;right:14px;bottom:14px;z-index:80;max-width:calc(100vw - 28px)}
.tui-bar,.tui-win{background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:var(--radius-md);box-shadow:var(--shadow-raise)}
.tui-bar{height:34px;padding:0 10px}
.tui-win{padding:10px}
.tui-screen{overflow:hidden;border:1px solid var(--hairline);border-radius:var(--radius-md);background:var(--bg)}
.tui-pre{margin:0;padding:10px;font:400 13px/17px var(--font);white-space:pre;letter-spacing:0;font-variant-ligatures:none;overflow:auto}
.tui-banner{padding:8px 10px;border-bottom:1px solid var(--hairline)}

/* ══════════════════════════════════════════════════════════════════════════
   PANEL INTERNALS

   Everything below was EMITTED by the panel modules but had no definition
   after the token rewrite — 69 classes and 8 custom properties across the
   nine live panels. The Gate Wall in particular rendered as empty spans: an
   entire axis of the board's two-axis argument was invisible on screen.

   Rules here are keyed to the markup the panels ACTUALLY emit, captured by
   rendering each module under Node against a live /api/board payload rather
   than read off the source by eye.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── GATE WALL — the correctness axis ─────────────────────────────────────
   Fixed square cells in a dense grid. Design §9.3 fixes the column count at 12
   for every suite size; wall.js sets it inline from one constant so the wall
   reads as the same object from cell to cell. Only cell metrics live here.

   TWO COLOURS AND AN ABSENCE. The wall is a dumb component: it reports the
   per-gate outcome of the last completed test run and nothing else. There is no
   phase, no attempt axis, no live signal, and no motion of any kind.

     green      solid check    — passing in the last completed test run
     red        solid danger   — failing in the last completed test run
     unobserved dashed, no fill — no result yet; NOT a weaker pass

   The two fills differ in luminance (#6dff9e check · #ff6b6b danger) so a
   greyscale screenshot separates them, and untested keeps a SHAPE difference
   rather than a hue one — the single most common state is legible with no
   colour at all. The legend below the grid carries the meaning in words. */
.gwall{display:grid;gap:3px;grid-auto-rows:1fr}
.gcell{aspect-ratio:1;border-radius:2px;background:var(--check);border:1px solid transparent;min-width:0}
.gcell.green{background:var(--check);border-color:var(--check)}
.gcell.red{background:var(--danger);border-color:var(--danger)}
.gcell.unobserved{background:transparent;border:1px dashed var(--dim)}
/* the legend's inline swatches — fixed 9px, never stretched by the grid */
.gcell.sm{width:9px;height:9px;aspect-ratio:auto;display:inline-block;vertical-align:baseline;flex:none}
.wall-legend{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font:400 12px var(--font);color:var(--dim)}
.wall-legend>span{display:inline-flex;align-items:center;gap:7px;min-width:0}
.wall-legend .note{flex:1 1 220px;min-width:0}
.wall-empty{display:flex;flex-direction:column;gap:7px;padding:18px;border:1px dashed var(--border-strong);border-radius:var(--radius-md)}
/* THE UNWIRED REASONS. Rows, never squares: anything square-shaped on this
   panel reads as a gate, and a reason is not one. */
.gphases{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.gphase{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font:400 12.5px var(--font);color:var(--fg)}
.gp-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.06em}
.gp-detail{flex:none;font-weight:700}

/* ── TRANSFER CURVE — the empty/void frames ──────────────────────────────
   These are the states where there is nothing to plot. They are designed
   answers, not degraded plots, so they get real type hierarchy. */
.curve-frame-head{font:700 13px var(--font);letter-spacing:.02em;color:var(--type)}
.curve-frame-line{font:400 12.5px/1.6 var(--font);color:var(--fg);margin-top:6px}
.curve-frame-note{font:400 12px/1.6 var(--font);color:var(--dim);margin-top:6px}
.curve-frame.bad .curve-frame-head{color:var(--danger)}
.curve-frame.bad{border-color:var(--danger)}
.curve-foot{display:flex;gap:22px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--hairline);font:400 12px var(--font);color:var(--dim)}
.curve{flex:1 1 0}

/* ── RUN LEDGER — row cells ───────────────────────────────────────────────
   The track list is on .ledger-row; these style the cells within it. The
   long identity columns are the ONLY ones allowed to ellipsize — a truncated
   number would be a lie, a truncated model name is merely abbreviated. */
.ledger-row>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arm{font-weight:700;letter-spacing:.06em}
.model{color:var(--fg)}
.delta{color:var(--type);white-space:nowrap}
.delta.worse{color:var(--danger)}
.ledger-row.live .delta{color:var(--dim)}
.ledger-empty{padding:18px;border:1px dashed var(--border-strong);border-radius:var(--radius-md);font:400 12.5px/1.6 var(--font);color:var(--dim)}
/* THE PINNED FLOOR. 2px top rule + the row sitting on --bg while its peers
   sit on --bg-2 is what makes the baseline read as a reference, not a peer. */
.ledger-foot{background:var(--bg);border-top:2px solid var(--fg);margin:0 calc(var(--pad) * -1) calc(var(--pad) * -1);padding:12px var(--pad);border-radius:0 0 var(--radius-xl) var(--radius-xl)}
.pin{display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--hairline);padding-right:14px}
.axes{display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1 1 0;min-width:0}
.axis{display:flex;flex-direction:column;gap:6px;padding:0 14px}
.axis+.axis{border-left:1px solid var(--hairline)}
/* EFFICIENCY and CORRECTNESS headline numbers — same size, side by side,
   never combined. The hard rule made typographic. */
.big{flex-direction:row;gap:26px;align-items:baseline;flex-wrap:wrap;font:700 var(--fs-metric)/1.1 var(--font);color:var(--type)}
.big .null,.big .muted{font:400 14px var(--font)}

/* ── THE BASELINES CARD ───────────────────────────────────────────────────
   One row per measured floor; profiles nested inside it; runs inside those.

   THE INDENT IS THE ARGUMENT, so it is drawn with RULES rather than padding:
   each level carries a left border, which is what makes "this profile belongs
   to that baseline" survive a screenshot, a scroll, and greyscale. Padding
   alone reads as a layout preference and can be mistaken for one.

   These names are `bl*`/`p*`/`r*` rather than `m*` because `.mrow` is ALREADY
   the memory-roster picker (a 24px/1fr/auto grid, above). Reusing it here would
   have made two unrelated surfaces share one rule, and a later edit to either
   would silently deform the other. */

/* SEVEN COLUMNS, shared by the header and every baseline row so they cannot
   drift. Lifted from the design specimen: 26 / 210 / 74 / 1fr / 84 / 84 / 128. */
.blcols,.blrow{display:grid;grid-template-columns:26px minmax(0,210px) 74px minmax(0,1fr) 84px 84px 128px;gap:10px;align-items:baseline;min-width:0}
.blcols{font:700 10px/1 var(--font);letter-spacing:.14em;color:var(--dim);padding:9px 4px;border-bottom:1px solid var(--hairline)}
.blcols>span,.blrow>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .ledger-head{align-items:center}
/* THE SUBTITLE IS ONE LINE AND ELLIPSIZES. Wrapped, it pushes the count, the
   serial chip and [+ PROFILE] onto a second row and the header stops reading as
   a header — the same rule `.phead .sub` already applies for the same reason. */
.bl .ledger-head .sub{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The count sits next to the title, not in the rows: "how much has this bench
   measured" is a property of the card. */
.blcount{font:400 12px var(--font);color:var(--fg);white-space:nowrap}
.blnew{white-space:nowrap}

.blwrap{border-bottom:1px solid var(--hairline);min-width:0}
.blwrap.open{background:var(--bg-2);border-bottom-color:var(--fg)}
/* A RUNNING BASELINE SITS ON THE RAISED SURFACE while its peers sit on the
   canvas — the same device the pinned floor uses. It is doing something; the
   others have finished. No animation: a stopped board must never imply motion,
   and a pulse here would be indistinguishable from one on a dead cell. */
.blwrap.running{background:var(--bg-2)}
/* The row is the click target for its contents, so it gets the pointer and a
   hover — a control that expands must look like one. */
.blrow{padding:10px 4px;cursor:pointer;font:400 12.5px/1.35 var(--font);color:var(--fg)}
.blrow:hover{background:color-mix(in srgb, var(--fg) 5%, transparent)}
.blcaret{color:var(--dim);font-size:11px}
/* THE BASELINE ID IS THE ANCHOR of the row: full contrast, full weight, so a
   six-row card scans by floor. */
.blid{font-weight:700;color:var(--type)}
.blkind{font:700 10.5px var(--font);letter-spacing:.1em;color:var(--fg)}
/* CLOUD IS THE ONLY OFF-PALETTE MARK ON THIS ROW, and it is not --danger: a
   cloud baseline is not a fault, it is a different substrate, and colouring it
   with the failure hue would read as one. */
.blkind.cloud{color:var(--link)}
.blmodel{color:var(--fg)}
.blstate{font:700 10.5px var(--font);letter-spacing:.12em;color:var(--fg)}
.blstate.running{color:var(--type)}
.blstate.void{color:var(--danger)}
/* THE VOID REASON, printed under the row it belongs to. Never a tooltip: a void
   floor's numbers look ordinary, so the sentence explaining them has to be on
   screen beside them. */
.blwhy{padding:0 4px 10px 36px;font:400 11.5px/1.5 var(--font)}
/* THE TWO SENTENCES THAT ARGUE THE NESTING. Side by side at equal weight,
   because they are two halves of one claim. */
.blnest{display:flex;gap:22px;flex-wrap:wrap;padding:11px 4px;border-bottom:1px solid var(--border-strong);font:400 11.5px/1.5 var(--font);color:var(--dim)}
.blnest>span{flex:1 1 300px;min-width:0}

/* LEVEL 2 — the profiles under a baseline. */
.blacc{padding:2px 0 12px 42px;border-left:1px solid var(--border-strong);margin-left:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
/* SIX COLUMNS. The specimen's 26 / 186 / 1fr / 96 / 128, plus a trailing track
   for [+ run] — the design sheet shows no control because it is a specimen of
   the layout, and the runs it describes have to start somewhere. */
.pcols,.prow{display:grid;grid-template-columns:26px minmax(0,186px) minmax(0,1fr) 96px 128px auto;gap:10px;align-items:baseline;min-width:0}
.pcols{font:700 10px/1 var(--font);letter-spacing:.14em;color:var(--dim);padding:0 8px 6px;border-bottom:1px solid var(--hairline)}
/* NO CELL MAY BLEED INTO ITS NEIGHBOUR. `no measured run` is wider than the
   track that holds it; without this the text overran the next column and the
   row read as one squashed sentence. Identity and prose truncate; they are
   never the numbers, which have their own tracks and always fit. */
.prow>span,.pcols>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow{padding:8px;border-radius:var(--radius-sm);font:400 12.5px/1.35 var(--font);color:var(--fg);cursor:pointer}
.prow:hover{background:color-mix(in srgb, var(--fg) 6%, transparent)}
.prow-wrap{min-width:0}
.prow-wrap.open .prow{background:var(--bg)}
.pname{font-weight:600;color:var(--type);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psrc{color:var(--dim)}
.pcaret{color:var(--dim);font-size:10px}
.pbest{font:700 10.5px var(--font);letter-spacing:.12em}
.pact{display:flex;justify-content:flex-end}
.pwhy{padding:0 8px 6px 8px;font:400 11px/1.5 var(--font)}
/* The profile's own expansion: the frozen policy, then the runs. */
.pbody{padding:4px 0 10px 14px;border-left:1px solid var(--hairline);margin-left:12px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* LEVEL 3 — the runs under a profile. */
.rsec{display:flex;flex-direction:column;gap:6px;min-width:0}
.rcols,.rrow{display:grid;grid-template-columns:26px 100px 108px minmax(0,1fr) 96px minmax(128px,auto);gap:10px;align-items:baseline;min-width:0}
.rcols{font:700 10px/1 var(--font);letter-spacing:.14em;color:var(--dim);padding-bottom:5px;border-bottom:1px solid var(--hairline)}
.rrow{padding:6px 0;font:400 12px var(--font);color:var(--dim);border-bottom:1px solid var(--hairline)}
.rcols>span,.rrow>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rseq{color:var(--fg)}
.rdetail{color:var(--dim)}
/* ── THE FROZEN POLICY DRAWER ─────────────────────────────────────────────
   What the MEMORY PROFILE card and its inspector modal used to show, opened
   under the profile row it belongs to. It is INSET — a left rule and its own
   ground — so it reads as detail belonging to the row above rather than as a
   sibling panel that happens to be nearby.

   TWO COLUMNS: the policy (what was frozen) beside the consequence (what it
   implies, what it does not yet enforce, what has run under it). One column
   below 1100px, because a squeezed two-column run table is less legible than a
   stacked one. */
.pdrawer{margin-top:2px;padding:12px 14px;background:var(--bg-2);border:1px solid var(--border);border-left:3px solid var(--fg);border-radius:var(--radius-md);display:flex;flex-direction:column;gap:12px;min-width:0}
.pd-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.pd-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;min-width:0}
.pd-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.pd-sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.pd-secline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.pd-subject{display:flex;flex-direction:column;gap:4px;padding:9px 11px;border:1px solid var(--border-strong);border-radius:var(--radius-sm)}
.pd-models{display:flex;flex-direction:column;gap:5px;min-width:0}
/* Rows here are NOT selectable — the profile is frozen. No pointer cursor and
   no hover affordance, so nothing implies an edit that does not exist. */
.pd-models .mrow{cursor:default;border-color:var(--hairline)}
.pd-models .mrow.on{border-color:var(--fg);background:color-mix(in srgb, var(--fg) 8%, transparent)}
.pd-models .mrow.off{color:var(--dim)}
/* The doubled debt rule. Same double border as .debt so it survives greyscale,
   with room for the explanatory body. */
.pd-debt{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:2px solid var(--danger);border-bottom:2px solid var(--danger)}
.debt-kick{font:700 10.5px var(--font);letter-spacing:.16em;color:var(--danger)}
.debt-body{font:400 12px/1.55 var(--font);color:var(--fg)}
/* RUN HISTORY. The log name is how an operator finds a cell on disk, so it gets
   a real share of the width and is the last thing allowed to collapse. */
.pd-cols,.pd-row{display:grid;grid-template-columns:48px minmax(0,1fr) 150px minmax(0,1.1fr);gap:10px;align-items:baseline;min-width:0}
.pd-cols{font:700 9.5px var(--font);letter-spacing:.14em;color:var(--dim);padding-bottom:5px;border-bottom:1px solid var(--hairline)}
.pd-row{padding:6px 0;font:400 12px var(--font);border-bottom:1px solid var(--hairline)}
.pd-row .model,.pd-row .log{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd-row .arm{color:var(--type)}
.pd-row .log{color:var(--dim)}
.pd-empty{padding:10px 0;font:400 11.5px/1.6 var(--font);color:var(--dim)}

/* ORPHANED PROFILES. Dashed + dim: present and accounted for, but not a live
   control surface — nothing can be launched under them. */
.lorph{margin-top:10px;padding:10px 12px;border:1px dashed var(--border-strong);border-radius:var(--radius-md);display:flex;flex-direction:column;gap:5px}
.lorph-row{display:flex;gap:10px;align-items:baseline;font:400 11.5px/1.4 var(--font)}

/* ── LIVE RUN ─────────────────────────────────────────────────────────────
   TWO columns: spine | feed. The third column (extraction) was removed in
   WO-BOARD-EXTRACT-1 — extraction is now a popout, because a run-scoped
   column could only ever show ONE extraction and vanished behind a live run.
   The 380px track went with it: leaving it would reserve dead space that
   nothing renders into, and the feed would stay artificially narrow. */
.live{display:grid;grid-template-columns:340px minmax(0,1fr);gap:var(--gap);align-items:start}
.live-spine,.live-feed{display:flex;flex-direction:column;gap:8px;min-width:0}
.live-feed{min-height:0}
.spine{display:flex;flex-direction:column;gap:8px}
/* A PHASE. The running phase carries a 3px left rule; a done phase does not.
   `.now` is the only bright tick — motion is never implied on a stopped cell. */
.ph{border:1px solid var(--border);border-radius:var(--radius-md);padding:9px 11px;display:flex;flex-direction:column;gap:7px;min-width:0}
.ph.running{border-color:var(--fg);border-left-width:3px;background:var(--bg)}
.ph.done{border-color:var(--border)}
.ph.pending{border-color:var(--hairline);color:var(--dim)}
.ph-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font:700 12px var(--font);color:var(--dim)}
.ph.running .ph-top,.ph.done .ph-top{color:var(--type)}
.ph-state{letter-spacing:.14em;flex:none}
.ph-note{font:400 11.5px var(--font);color:var(--dim)}
.ticks{display:flex;gap:3px}
.tick{flex:1;height:6px;border:1px solid var(--border-strong);border-radius:1px}
.tick.done{background:var(--fg);border-color:var(--fg)}
.tick.now{background:var(--fg);border-color:var(--fg);opacity:.45}
.prov-tot{display:flex;flex-direction:column;gap:5px;padding-top:9px;border-top:1px solid var(--hairline)}

/* ── EVENT FEED ───────────────────────────────────────────────────────────
   34px CONSTANT ROW HEIGHT is load-bearing, not cosmetic: sticky-bottom
   arithmetic (BOTTOM_EPS=24 in live.js) assumes rows never change height.
   Anything that alters row height silently breaks autoscroll. */
.feed-head{flex-wrap:wrap;gap:8px}
.evbox{flex:1;min-height:240px;max-height:420px;overflow-y:auto;overflow-x:hidden;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg)}
.evrow{display:grid;grid-template-columns:74px 22px auto minmax(0,1fr);gap:10px;align-items:center;height:34px;padding:0 11px;border-bottom:1px solid var(--hairline);font:400 12.5px var(--font);color:var(--fg)}
.evt{color:var(--dim);font-size:11.5px}
.evmark{text-align:center;font-weight:700;color:var(--fg)}
.evname{color:var(--type);white-space:nowrap}
.evdetail{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.evrow.error .evmark,.evrow.error .evname,.evrow.error .evdetail{color:var(--danger)}
.evrow.thinking .evname,.evrow.thinking .evdetail{color:var(--dim);font-style:italic}
.evrow.lifecycle .evname{color:var(--dim)}
/* USER TURNS — the verbatim text handed to the model. Marked with the type
   colour and a left rule so a turn the model was GIVEN is never mistaken for
   something the model DID: everything else in this feed is the agent acting. */
.evrow.user{box-shadow:inset 2px 0 0 var(--type)}
.evrow.user .evmark,.evrow.user .evname{color:var(--type)}
/* HARNESS / GRADING — the verdict channel (control/gate-events.mjs).
   PROMINENT ON PURPOSE, and louder than any agent row. Between attempts the
   agent is idle BY DESIGN while grading runs, so every other kind falls silent
   and this is the only line still moving — it is the sole signal separating
   "grading" from "wedged", the exact ambiguity that cost 32 unobserved minutes
   on 2026-08-12.

   A FULL-WIDTH TINT, not just a coloured mark. The other kinds are events in a
   stream; these are the boundaries BETWEEN attempts, so they read as rules
   across the feed rather than as entries within it. The detail is left bright
   because the gate counts it carries are the payload, not decoration. */
.evrow.harness{box-shadow:inset 3px 0 0 var(--check);background:color-mix(in srgb,var(--check) 7%,transparent)}
.evrow.harness .evmark,.evrow.harness .evname{color:var(--check);font-weight:700}
.evrow.harness .evdetail{color:var(--type)}
.evpath{font-size:12px}
/* THE ONLY MOTION ON THE BOARD. Background + inset rule, one shot. Never
   height/margin/transform — those would reflow the feed mid-scroll. */
@keyframes evflash{from{background:color-mix(in srgb,var(--fg) 14%,transparent);box-shadow:inset 3px 0 0 var(--fg)}to{background:transparent;box-shadow:inset 3px 0 0 transparent}}
.evrow.fresh{animation:evflash 1s var(--ease) 1}
.evrow.fresh.error{animation-duration:1.6s}
@media (prefers-reduced-motion:reduce){.evrow.fresh{animation:none;box-shadow:inset 3px 0 0 var(--fg)}}
.pill{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;font:700 11px var(--font);letter-spacing:.14em;color:var(--bg);background:var(--fg);border:0;border-radius:var(--radius-pill);padding:5px 14px;cursor:pointer;z-index:5}
.live-feed{position:relative}
.pad{padding:18px}

/* ── EXTRACTION STAGES ────────────────────────────────────────────────────
   The state word is `complete`, NEVER `done`. A prior drift bug keyed the
   CSS on `done`; every finished stage rendered blank and the counter read
   0/10.
   GATED is a double rule PLUS the word, so it survives greyscale. */
.stages{display:flex;flex-direction:column;gap:4px;min-width:0}
.stage{display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font:400 12.5px var(--font);color:var(--fg);min-width:0}
.sg{font-weight:700;text-align:center;color:var(--dim)}
.sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ss{font-size:11px;letter-spacing:.14em;color:var(--dim);flex:none}
.stage.complete .sg{color:var(--type)}
.stage.running{border-color:var(--fg);background:var(--bg)}
.stage.running .sg,.stage.running .ss{color:var(--type)}
.stage.pending{border-color:var(--hairline);color:var(--dim)}
.stage.failed{border-color:var(--danger);color:var(--danger)}
.stage.failed .sg,.stage.failed .ss{color:var(--danger)}
.stage.gated{border-color:var(--danger);border-top-width:2px;border-bottom-width:2px;color:var(--type)}
.stage.gated .sg,.stage.gated .ss{color:var(--danger)}

/* ── HONESTY RAIL ─────────────────────────────────────────────────────────
   SIX ACROSS at 1920 (artifact §8.1), reflowing to auto-fit on narrow
   viewports. It was inheriting flex-direction:column from the panel rule and
   stacking as six full-width blocks down the page. */
.rail{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;background:transparent;border:0;padding:0}
.railbox{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.railbox.debt-box{border-color:var(--danger)}
.label{font:700 10.5px var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.railval{font:700 15px var(--font);color:var(--type);word-break:break-word}
.railval .label{font-size:10.5px;color:var(--dim)}
.railnote{font:400 11.5px/1.45 var(--font);color:var(--dim)}

/* ── RECALL (demoted) ─────────────────────────────────────────────────────
   Proves retrieval fires. Deliberately the quietest panel on the board. */
.pbody{display:flex;flex-direction:column;gap:8px;min-width:0;padding:4px 0}
.collect{font:700 15px var(--font);letter-spacing:.12em;color:var(--type)}
.ident{font:400 var(--fs-ident) var(--font);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--hairline);font:400 12px var(--font)}
.disp{font-weight:700;flex:none}
.atomic{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);font:400 12.5px/1.6 var(--font);color:var(--fg)}
.state{font-weight:700;letter-spacing:.1em}
.fail{color:var(--danger);font-family:var(--font)}

/* ── THE MEMORY ROSTER ROW ────────────────────────────────────────────────
   `.mrow` is shared by the frozen-policy drawer's roster (read-only) and
   nothing else now: the creation modal's picker moved into the [+ PROFILE]
   flow, which draws its own `.cline`. The modal chrome that used to wrap it
   (.modal-head/.modal-title/.modal-body/.modal-foot) went with it. */
.mcheck{font-weight:700;text-align:center;color:var(--type)}
.mid{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mnote{font-size:11.5px;color:var(--fg);flex:none}
.mnote.muted{color:var(--dim)}
.debt-body{border-top:2px solid var(--danger);border-bottom:2px solid var(--danger);padding:11px 0}
.profile-models{gap:5px;flex-direction:column;flex-wrap:nowrap}

/* ── TUI POPOUT ───────────────────────────────────────────────────────────
   The window is sized to the 40×130 character grid by tui.js inline; these
   rules must never impose a width that would squeeze that grid. */
.tui-brand{font:700 12px var(--font);color:var(--type);flex:none}
.tui-stat{font:400 12px var(--font);color:var(--fg);flex:none}
/* ── STARTUP FEED (panels/startup.js) ──────────────────────────────────────
   Occupies the TUI grid until a real terminal frame paints, then yields.

   REPLACES `.tui-state` / `.tui-line`, which styled the five placeholder
   screens the feed absorbed. Those rules are deleted along with their markup —
   a stylesheet that keeps definitions for classes nothing emits is how the
   sheet and the panels drift apart, which is what style-coverage.test.mjs
   exists to catch. */
.sfeed{display:flex;flex-direction:column;height:100%;min-height:0;font-family:var(--font)}
.sfeed-head{display:flex;align-items:baseline;gap:12px;padding:10px 12px;border-bottom:1px solid var(--hairline);flex:none}
/* THE VERDICT IS THE HEADLINE. One line answering "can a benchmark start right
   now" — read before any individual row, and the only text here that is allowed
   to carry the danger hue at full weight. */
.sfeed-verdict{font:400 12px var(--font);color:var(--dim)}
.sfeed-verdict.bad{color:var(--danger);font-weight:700}
.sfeed-rows{flex:1 1 auto;min-height:0;overflow:auto;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.sfeed-foot{flex:none;padding:8px 12px;border-top:1px solid var(--hairline);font:400 11px/1.5 var(--font);color:var(--dim)}

/* ONE ROW PER PROCESS. A four-column grid so the state word and the detail
   align down the list — a ragged left edge on a status list makes scanning for
   the one broken row into reading, which defeats the purpose. `why` and
   `reason` span the full width beneath. */
.sfrow{display:grid;grid-template-columns:10px minmax(0,190px) 74px minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 8px;border:1px solid transparent;border-radius:var(--radius-sm)}
/* ONLY `bad` GETS A BOX. Drawing a border around every row would make the
   blocking one just another row in a grid; leaving the healthy rows unframed is
   what lets the failure carry weight without any colour being added. */
.sfrow.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 7%,transparent)}
.sfrow.off,.sfrow.idle{opacity:.62}
.sfdot{width:8px;height:8px;border-radius:50%;align-self:center;background:var(--dim)}
.sfdot.ok,.sfdot.busy{background:var(--check)}
.sfdot.bad{background:var(--danger)}
/* OFF AND IDLE ARE HOLLOW — absence drawn as absence, never as a second hue.
   A colour would read as a third category of health; a hollow dot reads as
   "nothing is happening here", which is the truth. */
.sfdot.off,.sfdot.idle,.sfdot.unknown{background:transparent;border:1px solid var(--border-strong)}
.sfname{font:400 12.5px var(--font);color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis}
.sfstate{font:700 10px var(--font);letter-spacing:.10em;color:var(--dim)}
.sfrow.bad .sfstate{color:var(--danger)}
.sfrow.ok .sfstate,.sfrow.busy .sfstate{color:var(--check)}
.sfdetail{font:400 12px var(--font);color:var(--type);min-width:0;overflow:hidden;text-overflow:ellipsis}
/* THE EXPLANATION RIDES EVERY ROW, not a tooltip. Nobody hovers on a stream,
   and an operator who has to ask what a process does has learned nothing from a
   coloured dot. */
.sfwhy{grid-column:2/-1;font:400 11px/1.5 var(--font);color:var(--dim)}
/* THE REASON IS THE PAYLOAD — the publisher's own words, verbatim. This is the
   line whose absence made the failed [+ baseline] click invisible, so it is
   never clipped, never truncated, and never behind an interaction. */
.sfreason{grid-column:2/-1;font:400 11.5px/1.55 var(--font);color:var(--fg);white-space:pre-wrap}
.sfreason.bad{color:var(--danger)}

/* The minimized dock carries the blocking count, because the dock is minimized
   by default and a failure only visible once expanded is one the operator has
   to go looking for. */
.tui-block{font:700 10px var(--font);letter-spacing:.10em;color:var(--danger);border:1px solid var(--danger);border-radius:var(--radius-sm);padding:2px 7px}
.tui-ready{font:700 10px var(--font);letter-spacing:.10em;color:var(--dim)}
.tui-confirm{width:min(376px,calc(100vw - 48px))}
.tui-confirm .body{line-height:1.65}
.tui-pre.dim{opacity:.55}
.btn.destroy.solid{background:var(--danger);color:var(--bg);border-color:var(--danger)}
.confirm-actions{flex-direction:column;align-items:stretch;gap:8px}
.confirm-actions .btn{text-align:center}

/* ── POPOUT SHELL (panels/popout.js) ──────────────────────────────────────
   Generalised from the TUI dock. Docks stack UPWARD from bottom-right and
   their `bottom` is computed per dockIndex in JS, so two popouts can never
   land on the same slot. The window width is set inline FROM its content —
   these rules must never impose one, which is the defect the TUI panel
   exists to fix ("the space was not made for the TUI"). */
.pop-dock{position:fixed;right:14px;z-index:80;max-width:calc(100vw - 28px)}
.pop-bar,.pop-win{background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:var(--radius-md);box-shadow:var(--shadow-raise)}
.pop-bar{height:34px;padding:0 10px;display:flex;align-items:center;gap:12px;min-width:0}
.pop-win{padding:10px;display:flex;flex-direction:column;gap:9px;max-width:calc(100vw - 28px);max-height:calc(100vh - 40px)}
.pop-head{display:flex;align-items:center;gap:12px;min-width:0}
.pop-brand{font:700 12px var(--font);color:var(--type);flex:none}
.pop-stat{font:400 12px var(--font);color:var(--fg);flex:none}
.pop-body{overflow:auto;min-height:0;font-family:var(--font)}
.pop-foot{font:400 11.5px var(--font);color:var(--dim);padding-top:8px;border-top:1px solid var(--hairline)}
.pop-tabs{display:flex;gap:6px;border-bottom:1px solid var(--hairline);padding-bottom:8px}
.pop-tab{font:700 10.5px var(--font);letter-spacing:.14em;color:var(--dim);background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 11px;cursor:pointer}
/* The ACTIVE tab differs by fill AND border, not hue alone — the board has to
   survive a greyscale screenshot. */
.pop-tab.on{color:var(--type);border-color:var(--fg);background:color-mix(in srgb, var(--fg) 10%, transparent)}
.pop-n{color:var(--fg);font-weight:400}

/* ── EXTRACTION: PROCESS VIEW ─────────────────────────────────────────── */
.xproc{display:flex;flex-direction:column;gap:9px}
/* A measured count sits beside the stage name. 0 is rendered, never blanked. */
.scount{font:400 11.5px var(--font);color:var(--fg);flex:none}
.stage{grid-template-columns:14px minmax(0,1fr) auto auto}

/* ── EXTRACTION: QUEUE VIEW ───────────────────────────────────────────────
   Column track is shared by the header and every row so they cannot drift. */
.xq{display:flex;flex-direction:column;min-width:0}
.xq-cols,.xq-row{display:grid;grid-template-columns:150px 118px 132px minmax(0,1fr) 128px 92px 116px;gap:12px;align-items:center;min-width:0}
.xq-cols{font:700 10px var(--font);letter-spacing:.14em;color:var(--dim);padding:0 0 8px;border-bottom:1px solid var(--hairline)}
.xq-row{padding:9px 0;border-bottom:1px solid var(--hairline);font:400 12.5px var(--font);color:var(--fg)}
.xq-row.live{background:var(--bg-2)}
.xq-sess{color:var(--type);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xq-origin,.xq-model,.xq-corpus,.xq-wrote{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.xq-origin{color:var(--dim)}
.xq-stage{display:flex;align-items:center;gap:9px;min-width:0}
.xq-slabel{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xq-state{font:700 10.5px var(--font);letter-spacing:.12em;color:var(--fg);flex:none}
.xq-state.run{color:var(--type)}
.xq-state.gated{color:var(--danger)}
.xq-state.zero,.xq-state.pending{color:var(--dim)}
/* STAGE PIPS. Distinguished by FILL and BORDER STYLE, never colour alone:
   a dashed empty pip and a solid filled one are different in greyscale. */
.pips{display:flex;gap:2px;flex:none}
.pip{width:12px;height:7px;border-radius:1px;border:1px dashed var(--dim);background:transparent}
.pip.done{background:var(--fg);border:1px solid var(--fg)}
.pip.todo{background:transparent;border:1px dashed var(--dim)}
.pip.gated,.pip.failed{background:transparent;border:1px solid var(--danger)}
.xq-unwired{display:flex;flex-direction:column;gap:5px;padding-top:12px;margin-top:4px;border-top:1px solid var(--hairline)}

/* ── EXTRACTION: DEDUP VIEW ───────────────────────────────────────────────
   The threshold, the observed range and the flagged/kept split are the
   tuning instrument — they are headline figures, not a footnote. */
.xd-head{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding-bottom:10px}
.xd-stat{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
/* FLAGGED-NEVER-DROPPED is stated on the surface, bordered so it reads as a
   standing invariant rather than a passing note. */
.xd-invariant{display:flex;flex-direction:column;gap:5px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-lg);margin-bottom:10px}
.xd{display:flex;flex-direction:column;min-width:0}
.xd-cols,.xd-row{display:grid;grid-template-columns:86px 124px 118px 150px minmax(0,1fr) 78px 96px;gap:12px;align-items:center;min-width:0}
.xd-cols{font:700 10px var(--font);letter-spacing:.14em;color:var(--dim);padding-bottom:8px;border-bottom:1px solid var(--hairline)}
.xd-row{padding:8px 0;border-bottom:1px solid var(--hairline);font:400 12.5px var(--font);color:var(--fg)}
.xd-score{font-weight:700;color:var(--type)}
.xd-score.hot{color:var(--danger)}
.xd-src,.xd-fp,.xd-match,.xd-model{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.xd-fp,.xd-match{color:var(--dim)}
.xd-size{color:var(--dim);font-size:11.5px}
.xd-decision{font:700 10.5px var(--font);letter-spacing:.12em;color:var(--fg)}
/* FLAGGED is not an error state — it is a decision recorded for review, and
   the memory was KEPT. Marked with the type colour, never the danger colour. */
.xd-decision.flagged{color:var(--type)}
.xd-decision.kept{color:var(--dim)}
.xd-bodies{display:flex;flex-direction:column;gap:6px;padding-top:12px;margin-top:8px;border-top:1px solid var(--hairline)}
.xd-q{font:400 11.5px var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;overflow-x:auto;white-space:pre}

/* ── VIEWPORT STEP-DOWN for the new grids ────────────────────────────────
   Measured breakpoints. Nothing is ever hidden — the rail reflows and the
   live panel stacks rather than clipping a column. */
@media (max-width:1600px){
  .live{grid-template-columns:300px minmax(0,1fr)}
  .rail{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1400px){
  .live{grid-template-columns:minmax(0,1fr)}
  .live-spine{grid-column:1 / -1}
}
@media (max-width:1100px){
  .axes-row{grid-template-columns:minmax(0,1fr)}
  .live{grid-template-columns:minmax(0,1fr)}
  .rail{grid-template-columns:repeat(2,minmax(0,1fr))}
  .axes{grid-template-columns:1fr}
  .axis+.axis{border-left:0;border-top:1px solid var(--hairline);padding-top:10px}
  /* The policy drawer stacks rather than compressing. Nothing is hidden: the
     run table keeps its LOG column, which is how a cell is found on disk. */
  .pd-grid{grid-template-columns:minmax(0,1fr)}
  .pd-cols,.pd-row{grid-template-columns:44px minmax(0,1fr) 132px minmax(0,1fr)}
}
</style>
